name: NovaWallet API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            nova-wallet-api/package-lock.json
            api-automation-test/package-lock.json

      - name: Install nova-wallet-api dependencies
        working-directory: nova-wallet-api
        run: npm ci

      - name: Install api-automation-test dependencies
        working-directory: api-automation-test
        run: npm ci

      - name: Typecheck test framework
        working-directory: api-automation-test
        run: npm run typecheck

      - name: Run API test suite (Playwright auto-builds and starts nova-wallet-api via webServer)
        working-directory: api-automation-test
        env:
          CI: true
          API_BASE_URL: http://localhost:3000
          API_TOKEN: novapay-dev-token
        run: npm test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: api-automation-test/playwright-report/
          retention-days: 14
